name: Deploy ARKER static showroom
on:
  push:
    branches: [main]
    paths: ['project/web1/site/**', 'project/web3/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arker-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/web1/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: npm run check
      - run: npm run build
      # web3 영상 방송국(ARKER TV)을 같은 Pages 사이트의 /web3/ 아래에 둔다.
      - name: Build web3 into /web3/
        working-directory: project/web3/site
        run: |
          node --check app.js && node --check intake.js && node --check config.js
          node scripts/build.mjs
          rm -rf ../../web1/site/dist/web3
          cp -R dist ../../web1/site/dist/web3
          du -sh ../../web1/site/dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: project/web1/site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
